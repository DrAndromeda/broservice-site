<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Contact Us — BroService.in.th</title>
    <meta name="description" content="Contact us now for instant response. Phone, WhatsApp, Telegram. We speak English, Thai, Russian. +66 80-870-5704.">
    <link rel="icon" href="/assets/images/favicon.ico">
    <style>
        :root { --primary: #e88800; --primary-dark: #c47000; --dark: #1a1414; --dark2: #2b2424; --darker: #1f1919; --bg: #edeef0; --white: #fff; }
        html, body { width:100%; height:100%; padding:0; margin:0; }
        body { font:13px/22px Arial,Helvetica,sans-serif; color:#000; background:#1a1414; }
        .wrap { overflow:hidden; max-width:961px; margin:auto; }
        a { text-decoration:none; }
        .lang-switch { display:flex; justify-content:center; gap:8px; padding:2px 0; font-size:12px; z-index:100; }
        .lang-switch a { color:#888; padding:5px 12px; }
        .lang-switch a.active { color:#e88800; border:2px solid #e88800; border-radius:4px; font-weight:700; }
        header { width:100%; background:linear-gradient(180deg,#2b2424,#1f1919); z-index:100; }
        .linkblock { float:left; margin:46px 0 22px; font-size:269%; color:#e98400; font-weight:bold; text-shadow:1px 1px 2px #555; }
        .linkblock a { color:#d3d3d3; }
        .slogan { font-size:18px; line-height:22px; color:#d3d3d3; float:left; border-left:#2f2b2b 1px solid; margin:13px 0 0 28px; padding:18px 0 15px 29px; }
        .tooltips { float:right; margin:54px 50px 0 0; display:flex; gap:6px; align-items:center; }
        .tooltips a svg { width:28px; height:28px; border-radius:50%; display:block; }
        .nav-shadow { padding-top:10px; margin:24px 0 0; }
        .nav-shadow > div { background:linear-gradient(180deg,#e57c00,#c47000); border-radius:7px; box-shadow:0 3px 2px #201a1a; }
        ul.menu { overflow:hidden; text-align:center; padding:8px 2px; display:flex; flex-wrap:nowrap; justify-content:center; list-style:none; }
        ul.menu li { display:inline-block; padding:5px 7px; border-radius:6px; }
        ul.menu li a { font-size:14px; color:#1f1919; font-weight:bold; white-space:nowrap; }
        ul.menu li a:hover { color:#fff; }
        ul.menu li.active a { color:#e88800; }
        #content { background:#edeef0; width:100%; }
        #content > div { width:76%; margin:0 auto; }
        footer { background:var(--darker); text-align:center; padding:20px 0; }
        footer a { color:#e88800; }
        .footer-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:20px; text-align:left; margin-bottom:20px; }
        .footer-col h4 { color:#e88800; margin-bottom:10px; font-size:15px; }
        .footer-col p, .footer-col li { color:#ccc; font-size:13px; line-height:1.8; list-style:none; }
        .footer-col ul { list-style:none; padding:0; }
        .footer-col ul li a { color:#ccc; }
        .footer-col ul li a:hover { color:#e88800; }
        .footer-social { display:flex; gap:6px; margin-top:8px; }
        .footer-social a svg { width:22px; height:22px; border-radius:50%; display:block; }
        .footer-bottom { border-top:1px solid #333; padding-top:15px; margin-top:15px; font-size:12px; color:#888; }
        #content { text-align:center; }
        #content p, #content li, #content .justifyfull { text-align:left; max-width:700px; margin:10px auto; }
        #content h2, #content h3 { text-align:center; }
        #content .faq-item { text-align:left; max-width:700px; margin:0 auto; }
        
    
        /* FIX: ограничение изображений и контента */
        img { max-width: 100%; height: auto; border-radius: 7px; }
        #content img { max-width: 100%; height: auto; max-height: 400px; object-fit: contain; }
        .wrap img { max-width: 100%; height: auto; }
        
</style>
