        <style>
        :root {
            --primary: #e88800;
            --primary-dark: #c47000;
            --dark: #1a1414;
            --dark2: #2b2424;
            --darker: #1f1919;
            --bg: #edeef0;
            --text-light: #8f8b8c;
            --white: #fff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {

            padding: 4px 0 0;

        .header-inner {

        .logo span { color: #d3d3d3; font-weight: 300; }
        .header-right {

        }
        .header-phone { font-size: 13px; color: #d3d3d3; }

        .social-icons { display: flex; gap: 3px; }

        .social-icons a:hover { opacity: 0.7; }
        .social-icons svg { width: 22px; height: 22px; border-radius: 50%; display: block; }

        /* Nav – compact */

ul.menu li { display: inline-block; line-height: 16px; margin: 2px 1px; padding: 4px 6px; border-radius: 5px; transition: background 0.2s; }

ul.menu li a { font-size: 13px; line-height: 16px; color: #1f1919; font-weight: 600; white-space: nowrap; }

            color: #888;

            gap: 20px;
            justify-content: center;
            flex-wrap: nowrap;
        }
        .block {

            background: var(--white);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.2s;
        }
        .block:hover { transform: translateY(-2px); }
        .block img { width: 100%; display: block; }
        .block-content { padding: 14px; }
        .block h3 { font-size: 18px; color: var(--primary); margin-bottom: 6px; }
        .block p { color: var(--text-light); font-size: 13px; line-height: 1.5; margin-bottom: 12px; }

            background: var(--primary);
            color: var(--white);
            padding: 8px 20px;
            border-radius: 5px;
            font-weight: 600;
            font-size: 13px;
        }
        .block .btn:hover { background: var(--primary-dark); text-decoration: none; }

        /* Content */

            left: 0;
            color: var(--primary);
            font-weight: bold;
        }
        .float-img {

            margin: 0 0 15px 20px;
            border-radius: 8px;
            max-width: 40%;
            width: auto;
            height: auto;
        }
        .big-banner { margin: 20px 0; text-align: center; }
        .big-banner img { max-width: 100%; border-radius: 8px; }
        .service-hero img { max-width: 100%; height: auto; display: block; margin: 0 auto; border-radius: 8px; }
        img { max-width: 100%; height: auto; aspect-ratio: auto; }

        /* CTA */
        .cta-block {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--white);
            padding: 24px 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }
        .cta-block h2 { color: var(--white) !important; font-size: 24px !important; border: none !important; padding: 0 !important; margin-bottom: 10px !important; }
        .cta-block .phone { font-size: 28px; font-weight: 700; margin: 10px 0; }

        .cta-block .phone a:hover { text-decoration: none; }
        .cta-block .hours { font-size: 14px; opacity: 0.9; }

        footer {

            color: #aaa;
            padding: 30px 0 20px;

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));

            margin-bottom: 20px;

        .footer-col h4 {

            font-size: 16px;
            font-weight: 600;
            color: var(--white);
            margin-bottom: 12px;

        .footer-links a:hover { color: var(--primary); }

            font-size: 13px;
            color: #888;

            #content h1 { font-size: 22px; }
            #content h2 { font-size: 18px; }
            .float-img { float: none; margin: 0 auto 15px; max-width: 100%; height: auto; }
            .footer-grid { grid-template-columns: 1fr; }
